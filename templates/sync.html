<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Otomatik Veri Senkronizasyonu - Telematik Dashboard') }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F3F4F6;
            --primary: #6366F1;
            --primary-rgb: 99, 102, 241;
            --text-main: #111827;
            --text-muted: #6B7280;
            --sidebar-width: 280px;
            --radius: 24px;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

        .sidebar { width: var(--sidebar-width); background: white; height: 100vh; position: fixed; left: 0; top: 0; padding: 30px 20px; border-right: 1px solid #E5E7EB; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; text-decoration: none; color: var(--text-main); }
        .logo i { font-size: 1.8rem; color: var(--primary); }
        .logo h2 { font-size: 1.25rem; font-weight: 800; }

        .nav-menu { list-style: none; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text-muted); font-weight: 500; border-radius: 12px; transition: all 0.2s; margin-bottom: 8px; }
        .nav-link:hover, .nav-link.active { background: rgba(var(--primary-rgb), 0.1); color: var(--primary); }

        .main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 40px; }
        .card { background: white; border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); max-width: 800px; margin: 0 auto; }

        .sync-visual { text-align: center; margin-bottom: 40px; }
        .sync-icon-wrapper { width: 100px; height: 100px; background: rgba(var(--primary-rgb), 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; position: relative; }
        .sync-icon-wrapper i { font-size: 2.5rem; color: var(--primary); }
        .sync-icon-wrapper.loading i { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; margin-top: 10px; }
        .status-online { background: #DCFCE7; color: #166534; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; padding-top: 30px; border-top: 1px solid #F3F4F6; }
        .form-group label { display: block; font-weight: 700; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #E5E7EB; border-radius: 12px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary); }

        .btn-sync { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.3s; margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .btn-sync:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(var(--primary-rgb), 0.3); }
        .btn-sync:disabled { background: #D1D5DB; cursor: not-allowed; transform: none; }

        #logArea { margin-top: 30px; background: #0F172A; border-radius: 16px; padding: 20px; color: #10B981; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; height: 150px; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    {% include 'sidebar.html' %}

    <main class="main-content">
        <div class="card">
            <div class="sync-visual">
                <div class="sync-icon-wrapper" id="syncIcon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                <h2>{{ _('Otomatik Veri Senkronizasyonu') }}</h2>
                <p style="color: var(--text-muted); margin-top: 8px;">{{ _('Mail kutunuzdaki güncel yakıt, kantar ve takip dosyalarını otomatik işleyin.') }}</p>
                <div class="status-badge status-online"><i class="fa-solid fa-circle"></i> {{ _('Sistem Hazır') }}</div>
            </div>

            <div class="settings-grid">
                <div class="form-group"><label>{{ _('Mail Adresi') }}</label><input type="email" id="mailUser" class="form-control" placeholder="{{ _('Örn: rapor@sirket.com') }}"></div>
                <div class="form-group"><label>{{ _('Uygulama Şifresi') }}</label><input type="password" id="mailPass" class="form-control" placeholder="••••••••"></div>
                <div class="form-group" style="grid-column: span 2;"><label>{{ _('Gönderen Filtresi (Opsiyonel)') }}</label><input type="text" id="mailSender" class="form-control" placeholder="{{ _('Örn: noreply@arvento.com') }}"></div>
            </div>

            <button class="btn-sync" id="syncBtn" onclick="startSync()">
                <i class="fa-solid fa-bolt"></i> {{ _('Şimdi Senkronize Et') }}
            </button>

            <div id="logArea"></div>
        </div>
    </main>

    <script>
        async function startSync() {
            const btn = document.getElementById('syncBtn');
            const icon = document.getElementById('syncIcon');
            const logs = document.getElementById('logArea');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> İşleniyor...';
            icon.classList.add('loading');
            logs.style.display = 'block';
            logs.innerHTML = '> Bağlantı kuruluyor...<br>';

            // Ayarları kaydet
            await fetch('/api/save-mail-settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('mailUser').value,
                    password: document.getElementById('mailPass').value,
                    sender: document.getElementById('mailSender').value
                })
            });

            // Senkronizasyonu başlat
            try {
                const res = await fetch('/api/fetch-mail', { method: 'POST' });
                const data = await res.json();
                
                logs.innerHTML += `> Durum: ${data.success ? 'BAŞARILI' : 'HATA'}<br>`;
                logs.innerHTML += `> Mesaj: ${data.message}<br>`;
                if(data.details) logs.innerHTML += `> Detay: ${JSON.stringify(data.details)}<br>`;
                
                if(data.success) {
                    btn.style.background = '#10B981';
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Tamamlandı!';
                } else {
                    btn.style.background = '#EF4444';
                    btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Hata Oluştu';
                }
            } catch(e) {
                logs.innerHTML += `> Kritik Hata: ${e.message}<br>`;
            } finally {
                icon.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
